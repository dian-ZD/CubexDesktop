name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist
            files: |
              release/*.exe
              release/*.blockmap
          - os: ubuntu-latest
            script: dist:linux
            files: |
              release/*.AppImage
              release/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build Linux deps (libarchive for AppImage tooling)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools rpm
      - run: npm run ${{ matrix.script }}
        env:
          # electron-builder 需要在无签名配置时跳过代码签名探测
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # 桌面冒烟需要显示器与常用 GUI 库；CI 用 xvfb 跑（Windows 直接跑）
      - name: Smoke test
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2t64 libgbm1 libxss1
          xvfb-run -a --server-args="-screen 0 1280x1024x24" npm run test:desktop
        env:
          CUBEX_SMOKE: '1'
      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        run: npm run test:desktop
        env:
          CUBEX_SMOKE: '1'
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: ${{ matrix.files }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
